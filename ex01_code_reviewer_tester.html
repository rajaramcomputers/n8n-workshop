<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔍 AI Code Reviewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Fira+Code:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0d0d0d;
    color: #f0ede8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 36px;
    width: 100%;
    max-width: 720px;
  }

  .header { text-align: center; margin-bottom: 32px; }
  .header .icon { font-size: 52px; display: block; margin-bottom: 10px; }
  .header h1 {
    font-size: 30px;
    font-weight: 900;
    background: linear-gradient(90deg, #2980b9, #1abc9c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .header p { font-size: 14px; color: #777; margin-top: 6px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 10px;
  }

  .url-row { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 20px; align-items: center; }

  .url-input {
    flex: 1;
    background: #0f0f0f;
    border: 1px solid #2e2e2e;
    border-radius: 8px;
    padding: 9px 14px;
    color: #aaa;
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    outline: none;
  }
  .url-input:focus { border-color: #555; }

  textarea {
    width: 100%;
    height: 200px;
    background: #0f0f0f;
    border: 1px solid #2e2e2e;
    border-radius: 12px;
    padding: 16px;
    color: #c8ffd0;
    font-family: 'Fira Code', monospace;
    font-size: 13.5px;
    line-height: 1.7;
    resize: vertical;
    transition: border-color 0.2s;
    outline: none;
  }
  textarea:focus { border-color: #2980b9; }
  textarea::placeholder { color: #444; }

  button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #2980b9, #1abc9c);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 20px;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.99); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .result-box {
    margin-top: 28px;
    background: #0f0f0f;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 24px;
    display: none;
  }
  .result-box.visible { display: block; }

  .result-box .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #2980b9;
    margin-bottom: 14px;
    border: 1px solid #2980b940;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .result-text {
    font-size: 14.5px;
    line-height: 1.9;
    color: #ddd;
    white-space: pre-wrap;
    font-family: 'Inter', sans-serif;
  }

  .spinner { display: none; text-align: center; padding: 20px 0; font-size: 13px; color: #666; }
  .spinner.visible { display: block; }

  .error-box {
    margin-top: 20px;
    background: #1a0a0a;
    border: 1px solid #5a1a1a;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 13px;
    color: #f09090;
    display: none;
  }
  .error-box.visible { display: block; }

  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: #444;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <span class="icon">🔍</span>
    <h1>AI Code Reviewer</h1>
    <p>Paste your code below and get an instant AI review.</p>
  </div>

  <label>Webhook URL</label>
  <div class="url-row">
    <input class="url-input" id="webhook-url" type="text"
      value="http://localhost:5678/webhook/roast-my-code"/>
  </div>

  <label for="code-input">Your Code</label>
  <textarea id="code-input"
    placeholder="# paste your code here...
def divide(a, b):
    return a / b"></textarea>

  <button id="review-btn" onclick="reviewCode()">🔍 Review My Code</button>

  <div class="spinner" id="spinner">⏳ AI is reviewing your code...</div>
  <div class="error-box" id="error-box"></div>

  <div class="result-box" id="result-box">
    <span class="tag">AI Review</span>
    <div class="result-text" id="result-text"></div>
  </div>
</div>

<div class="footer">Ganpat University</div>

<script>
async function reviewCode() {
  const code    = document.getElementById('code-input').value.trim();
  const url     = document.getElementById('webhook-url').value.trim();
  const btn     = document.getElementById('review-btn');
  const spinner = document.getElementById('spinner');
  const resultBox  = document.getElementById('result-box');
  const resultText = document.getElementById('result-text');
  const errorBox   = document.getElementById('error-box');

  resultBox.classList.remove('visible');
  errorBox.classList.remove('visible');
  errorBox.textContent = '';

  if (!code) {
    errorBox.textContent = '⚠️ Please paste some code first.';
    errorBox.classList.add('visible');
    return;
  }

  btn.disabled = true;
  spinner.classList.add('visible');

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });

    if (!response.ok) throw new Error(`Server returned ${response.status}: ${response.statusText}`);

    const data = await response.json();
    const review = data.roast || data.text || JSON.stringify(data);
    resultText.textContent = review;
    resultBox.classList.add('visible');

  } catch (err) {
    errorBox.textContent = '❌ Could not reach n8n. Is the workflow active? Error: ' + err.message;
    errorBox.classList.add('visible');
  } finally {
    btn.disabled = false;
    spinner.classList.remove('visible');
  }
}

document.getElementById('code-input').addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') reviewCode();
});
</script>

</body>
</html>
